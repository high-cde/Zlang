[package]
name = "zdos-zlang"
version = "2026.2.0"
edition = "2021"

[dependencies]
bip39 = "3.0.0"
hex = "0.4.3"
rand = "0.10.3"
secp256k1 = "0.33.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }

[[bin]]
name = "zlang"
path = "src/main.rs"
